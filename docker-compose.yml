version: '3.8'

networks:
  spark-network:
    driver: bridge

services:
  spark-master:
    image: bitnami/spark:3.5.0
    container_name: spark-master
    environment:
      - SPARK_MODE=master
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
      - SPARK_DAEMON_MEMORY=1g
    ports:
      - '8080:8080' # Spark Master Web UI
      - '7077:7077' # Spark Master RPC Port
    networks:
      - spark-network

  spark-worker-1:
    image: bitnami/spark:3.5.0
    container_name: spark-worker-1
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=2g
      - SPARK_WORKER_CORES=2
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
    ports:
      - '8081:8081' # Worker 1 Web UI
    depends_on:
      - spark-master
    networks:
      - spark-network

  spark-worker-2:
    image: bitnami/spark:3.5.0
    container_name: spark-worker-2
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=2g
      - SPARK_WORKER_CORES=2
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
    ports:
      - '8082:8081' # Worker 2 Web UI
    depends_on:
      - spark-master
    networks:
      - spark-network

  benchmark-runner:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pyspark_factorial_benchmark
    depends_on:
      - spark-master
      - spark-worker-1
      - spark-worker-2
    networks:
      - spark-network
    volumes:
      - ./data/raw:/app/data/raw
      - ./reports/figures:/app/reports/figures
    environment:
      - PYTHONUNBUFFERED=1
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_DRIVER_HOST=benchmark-runner
    command: python -m src.benchmarks.factorial_benchmarks --data-dir data/raw